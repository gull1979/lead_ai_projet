name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperation du code source du depot
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installation des dependances pour les tests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Execution des tests unitaires de donnees
      - name: Run Pytest on Data
        run: pytest -m data

      # 5. Connexion securisee a Docker Hub via les secrets GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Construction et publication de l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/agritech-api:latest
            ${{ secrets.DOCKER_USERNAME }}/agritech-api:${{ github.sha }}